<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuoteHarbor</title><link rel="stylesheet" href="style.css"></head><body><header><div><img src="icons/icon48.png" alt=""><h1>QuoteHarbor</h1></div><a class="brand-link" href="privacy.html" target="_blank">Help</a></header><main><div class="eyebrow">YOUR RESEARCH, ANCHORED</div><h2>Keep the quote.<br>Remember why it mattered.</h2><p class="muted">Select text on a web page, then capture it with its source.</p><div id="page" class="page-info">Reading the current page…</div><button id="capture" class="primary full" style="margin-top:10px">Capture selected text</button><label for="quote">Quote or excerpt</label><textarea id="quote" maxlength="20000" placeholder="Capture a selection or paste a quote…" style="min-height:90px"></textarea><label for="note">Why it matters</label><textarea id="note" maxlength="20000" placeholder="Your interpretation, questions, or next step…" style="min-height:80px"></textarea><label for="tags">Tags (comma separated)</label><input id="tags" maxlength="160" placeholder="research, design, to-read"><div class="row" style="margin-top:12px"><button id="save" class="primary">Save to library</button><button id="library">Open library</button></div><p id="status" class="status" role="status" aria-live="polite"></p></main><footer><span>Private by default · Stored locally</span><span>1.1.0</span></footer><script type="module" src="popup.js"></script></body></html>
