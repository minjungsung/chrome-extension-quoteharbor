<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarginMemo</title><link rel="stylesheet" href="style.css"></head><body><header><div><img src="icons/icon48.png" alt=""><h1>MarginMemo</h1></div><a class="brand-link" href="privacy.html" target="_blank">Help</a></header><main><div class="eyebrow">PAGE NOTES</div><h2>A thought belongs with its page.</h2><p class="muted">Keep a thought with the page that inspired it.</p><div id="page" class="page-info">Reading the current page…</div><label for="note">Your note</label><textarea id="note" style="min-height:175px" placeholder="Key ideas, questions, next steps…" maxlength="20000"></textarea><div class="row" style="margin-top:10px"><button id="save" class="primary">Save note</button><button id="delete" class="quiet">Delete note</button></div><p class="muted">Notes match the exact page URL, excluding its fragment. Your saved notes stay on this device.</p><button id="library" style="width:100%">Open note library</button><p id="status" class="status" role="status" aria-live="polite"></p></main><footer><span>Private by default · Stored locally</span><span>1.0.0</span></footer><script type="module" src="popup.js"></script></body></html>
