<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuoteHarbor</title><link rel="stylesheet" href="style.css"></head><body><header><div><img src="icons/icon48.png" alt=""><h1>QuoteHarbor</h1></div><a class="brand-link" href="privacy.html" target="_blank">Help</a></header><main><div class="eyebrow">YOUR RESEARCH, ANCHORED</div><h2>Save that sentence.<br>Keep its source.</h2><p class="muted">Select a sentence, open QuoteHarbor, and save. Notes and tags can wait.</p><div id="page" class="page-info">Reading the current page…</div><button id="capture" class="primary full" style="margin-top:10px">Capture selected text</button><label for="quote">Quote or excerpt</label><textarea id="quote" maxlength="20000" placeholder="Capture a selection or paste a quote…" style="min-height:90px"></textarea><details id="clip-details"><summary>Add a note or tags (optional)</summary><label for="note">Why it matters</label><textarea id="note" maxlength="20000" placeholder="Your interpretation, questions, or next step…" style="min-height:80px"></textarea><label for="tags">Tags (comma separated)</label><input id="tags" maxlength="160" placeholder="research, design, to-read"></details><div class="row" style="margin-top:12px"><button id="save" class="primary">Save quote & source</button><button id="library">Open library</button></div><button id="undo" class="quiet full" hidden>Undo last save</button><p id="recent-count" class="muted"></p><p id="status" class="status" role="status" aria-live="polite"></p></main><footer><span>Private by default · Stored locally</span><span>1.2.1</span></footer><script type="module" src="popup.js"></script></body></html>
